version: 2

updates:
  # Majors ungrouped so a breaking jump is attributable to one PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  # Runtime deps ungrouped: raising a `~=X.Y.Z` pin is what reaches users.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    # Ineffective for the uv ecosystem as of 2026-08-31: Dependabot widens
    # `~=X.Y.Z` to a range regardless (#134 twice, #138). The pin is enforced
    # by .github/scripts/check_runtime_pins.py, not by this setting.
    versioning-strategy: "increase"
    groups:
      dev-tooling:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # 1.1.0 pins `syrupy==4.8.0`, which caps `pytest<9` and drags pytest
      # back to 8.4.2 — PYSEC-2026-1845. Drop this once it allows syrupy 5.
      - dependency-name: "pytest-textual-snapshot"
        versions: ["1.1.0"]
    open-pull-requests-limit: 5
