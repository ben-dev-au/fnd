version: 2

updates:
  # Workflow actions. Minor and patch land as one grouped PR; majors arrive
  # individually, because that is where the breaking changes are — this repo
  # sat three to seven majors behind until Node 20's deprecation surfaced it.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  # Python dependencies. Dev tooling is grouped: a ruff or pytest bump is low
  # stakes and CI proves it. Runtime deps stay ungrouped so each lands as its
  # own reviewable PR — raising a `~=X.Y.Z` pin is what reaches every user.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    # Raise the pin rather than widen the range. Left to itself Dependabot
    # rewrote `platformdirs~=4.9.6` to `>=4.9.6,<4.12.0`, floating three
    # untested minors to users — the exact defect the pins exist to stop.
    versioning-strategy: "increase"
    groups:
      dev-tooling:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # 1.1.0 pins `syrupy==4.8.0`, which caps `pytest<9` and drags pytest
      # back to 8.4.2 — PYSEC-2026-1845. Drop this once it allows syrupy 5.
      - dependency-name: "pytest-textual-snapshot"
        versions: ["1.1.0"]
    open-pull-requests-limit: 5
