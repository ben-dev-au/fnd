name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push supersedes the PR run still going for the same branch: its
  # three OS jobs are ~95 runner-minutes that can no longer gate anything.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pytest (${{ matrix.os }})
    # Cross-platform matrix: the same suite runs on all three supported
    # OSes so platform-specific path/launcher/stat behaviour is exercised
    # on the real thing. ``fail-fast: false`` so one OS going red still
    # reports the others. Free tier on public repos; private repos use the
    # 10x multiplier so keep an eye on the minutes budget.
    # Gated on format/typecheck (~1min combined): a lint or type failure
    # is visible before the ~30-40min matrix burns runner time proving it.
    # Also runs on push to main: protection does not require branches to
    # be up to date, so a PR is proven against an older tree and only the
    # post-merge run exercises the tree that actually landed.
    needs: [format, typecheck]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows is materially slower (spawn-based multiprocessing + slower file
    # I/O and tmp cleanup), so give the matrix headroom beyond the ~28 min the
    # macOS/Linux runs take; otherwise the Windows job is killed mid-suite
    # before pytest can report which tests failed.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Sync deps (frozen lockfile)
        run: uv sync --frozen
      - name: Test
        # Serial, no --testmon. CI is the gold-standard catch-all
        # behind the local pre-commit hook, which uses --testmon for
        # speed and may skip tests the developer's diff doesn't reach.
        run: uv run pytest -q -m "not slow"

  format:
    name: ruff-format
    # Format check is a separate small job so a formatting miss is
    # obvious in the PR check list without re-running the slow tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.13
      - run: uv sync --frozen --group dev
      - name: Ruff format (check only)
        run: uv run ruff format --check .

  typecheck:
    name: pyright (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.13
      - run: uv sync --frozen
      - name: Pyright
        run: uv run pyright
