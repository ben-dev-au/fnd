name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push supersedes the PR run still going for the same branch: its
  # three OS jobs are ~95 runner-minutes that can no longer gate anything.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pytest (${{ matrix.os }} ${{ matrix.shard }}/5)
    # Cross-platform matrix: the same suite runs on all three supported
    # OSes so platform-specific path/launcher/stat behaviour is exercised
    # on the real thing. ``fail-fast: false`` so one OS going red still
    # reports the others. Free tier on public repos; private repos use the
    # 10x multiplier so keep an eye on the minutes budget.
    # Gated on the ~1min checks so a lint or type failure surfaces before the
    # matrix spends 15 runners on it.
    # Also runs on push to main: protection does not require branches to
    # be up to date, so a PR is proven against an older tree and only the
    # post-merge run exercises the tree that actually landed.
    needs: [format, typecheck, pins]
    strategy:
      fail-fast: false
      matrix:
        # Five is a ceiling, not a preference: the free plan allows 5 concurrent
        # macOS jobs, and a sixth queues for a whole shard of wall clock.
        # Unsharded: windows 48.9, macos 32.6, ubuntu 30.5 min.
        os: [macos-14, ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4, 5]
    runs-on: ${{ matrix.os }}
    # Far above the ~12 min gate: past the limit a job is killed without
    # reporting which test failed.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Sync deps (frozen lockfile)
        run: uv sync --frozen
      - name: Test
        # Serial, no --testmon. CI is the gold-standard catch-all
        # behind the local pre-commit hook, which uses --testmon for
        # speed and may skip tests the developer's diff doesn't reach.
        shell: bash
        run: |
          set -euo pipefail
          files=$(uv run python .github/scripts/shard_tests.py "${{ matrix.shard }}" 5)
          echo "shard ${{ matrix.shard }}/5: $(echo "$files" | wc -l) files"
          uv run pytest -q -m "not slow" $files

  format:
    name: ruff-format
    # Format check is a separate small job so a formatting miss is
    # obvious in the PR check list without re-running the slow tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv python install 3.13
      - run: uv sync --frozen --group dev
      - name: Ruff format (check only)
        run: uv run ruff format --check .
      - name: pre-commit and CI run the same ruff
        run: python3 .github/scripts/check_ruff_sync.py

  typecheck:
    name: pyright (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv python install 3.13
      - run: uv sync --frozen
      - name: Pyright
        run: uv run pyright

  pins:
    name: runtime pins
    # uv.lock reaches no installer, so the pyproject specifiers ARE what users
    # get. Dependabot widens them by default; nothing but this job stops a
    # widened range shipping versions CI never ran. Stdlib only, ~5s.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Every user-facing dependency pins the minor
        run: python3 .github/scripts/check_runtime_pins.py
      - name: Branch protection requires exactly the matrix jobs
        # A required check no job reports blocks every PR forever; a job no
        # rule requires goes red without blocking anything.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/check_required_checks.py
