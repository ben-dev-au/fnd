name: claude code review

# Claude reviews each PR and posts findings as inline comments. It never
# appears in GitHub's Reviewers dropdown — that list is humans, teams and
# Copilot only — so this workflow is what makes the review happen.
#
# Needs an ANTHROPIC_API_KEY repository secret:
#   gh secret set ANTHROPIC_API_KEY
# Without it the job fails fast rather than silently skipping.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# Reviews cost API tokens per run, so supersede a still-running review when
# a new push lands rather than paying for both.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: review
    # Drafts are work in progress; review once it's marked ready.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
