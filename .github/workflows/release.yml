name: release

# Triggered on any `v*` tag. Builds sdist + wheel, emits SBOM and a
# SLSA-style build-provenance attestation, publishes to PyPI via a
# Trusted Publisher (OIDC — no API token in repo secrets), and opens
# a bump-PR against the Homebrew tap with the new sdist SHA-256.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `id-token: write` lets the build job mint an OIDC token for
      # the attestation step (and later for PyPI Trusted Publisher).
      id-token: write
      # `attestations: write` lets actions/attest-build-provenance
      # record the SLSA-style provenance for the artifacts we produce.
      attestations: write
    outputs:
      sdist-name: ${{ steps.meta.outputs.sdist }}
      sdist-sha256: ${{ steps.meta.outputs.sha256 }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard — release tag matches pyproject version
        # Fail fast (before build/publish) if the `vX.Y.Z` tag and the
        # declared version have drifted. pyproject is the single source;
        # this just stops a mismatched tag from shipping.
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$tag" = "$ver" ] || { echo "::error::tag v$tag != pyproject version $ver — bump pyproject.toml before tagging"; exit 1; }
          echo "tag and pyproject version agree: $ver"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv python install 3.13

      - name: Build sdist + wheel
        run: uv build --sdist --wheel --out-dir dist

      - name: Generate CycloneDX SBOM (S2)
        # SBOM lives outside dist/ so the PyPI publish step (which
        # uploads the whole packages-dir via twine) doesn't try to
        # upload a JSON file as a distribution and fail.
        run: |
          mkdir -p sbom
          uv tool install cyclonedx-bom
          uv export --format requirements-txt --no-hashes -o requirements.frozen.txt
          uv tool run cyclonedx-py requirements requirements.frozen.txt \
            --output-format JSON \
            --output-file sbom/sbom.cdx.json

      - name: Attest build provenance (S2)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.whl

      - name: Compute sdist metadata
        id: meta
        run: |
          set -euo pipefail
          sdist=$(ls dist/*.tar.gz | head -n1)
          sha=$(shasum -a 256 "$sdist" | awk '{print $1}')
          # PEP 625 sdist name is `{name}-{version}.tar.gz` and the name
          # part carries no `-` (normalised to `_`), so the first `-`
          # splits name from version — name-agnostic (fndr, fnd_x, …).
          base=$(basename "$sdist" .tar.gz)
          ver="${base#*-}"
          echo "sdist=$(basename "$sdist")" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/

  publish-pypi:
    name: publish to PyPI (Trusted Publisher)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish (OIDC, no token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Configure the Trusted Publisher at
          # https://pypi.org/manage/account/publishing/ pointing at
          # this repo + `release.yml` workflow + `pypi` environment.
          packages-dir: dist
          skip-existing: true

  release-notes:
    name: publish GitHub Release
    # publish-pypi too: with `needs: build` alone a failed upload still produced
    # a public release advertising a version and sdist checksum nobody could
    # install.
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF##*/}"
          # Attach sdist, wheel, and SBOM; the provenance attestation
          # is fetched separately via `gh attestation verify` and is
          # not uploaded as a release asset (GitHub stores it).
          # `--notes` is PREPENDED to `--generate-notes`, so the checksum leads
          # and GitHub's per-PR notes follow. The old static body pointed at a
          # CHANGELOG this repo has never had.
          gh release create "$tag" \
            --title "fnd $tag" \
            --notes "SHA-256 (sdist): \`${{ needs.build.outputs.sdist-sha256 }}\`" \
            --generate-notes \
            dist/*.tar.gz dist/*.whl sbom/sbom.cdx.json

  bump-homebrew-tap:
    name: bump homebrew-tap formula
    # Needs publish-pypi so the sdist exists when we resolve its URL.
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Open formula bump PR
        env:
          # HOMEBREW_TAP_PAT: fine-scoped PAT with PR-write to the tap
          # (the default GITHUB_TOKEN can't push cross-repo). Both live
          # on THIS repo, not the tap — the workflow runs here.
          # HOMEBREW_TAP_REPO = ben-dev-au/homebrew-tap.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_PAT }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          VERSION: ${{ needs.build.outputs.version }}
        if: ${{ vars.HOMEBREW_TAP_REPO != '' }}
        run: |
          set -euo pipefail
          # Resolve url + sha256 from PyPI's JSON API — one source of
          # truth, immune to name normalisation and the hashed storage
          # path. The index can lag the publish by a few seconds, so retry.
          meta=""
          for i in 1 2 3 4 5 6; do
            meta=$(curl -fsSL "https://pypi.org/pypi/fndr/${VERSION}/json" \
              | python3 -c "import sys,json;u=next(x for x in json.load(sys.stdin)['urls'] if x['packagetype']=='sdist');print(u['url']);print(u['digests']['sha256'])") \
              && [ -n "$meta" ] && break
            echo "PyPI JSON not ready (attempt $i); retrying…" >&2
            sleep 10
          done
          [ -n "$meta" ] || { echo "could not resolve sdist for fndr $VERSION" >&2; exit 1; }
          new_url=$(printf '%s\n' "$meta" | sed -n 1p)
          new_sha=$(printf '%s\n' "$meta" | sed -n 2p)

          tmp=$(mktemp -d)
          git clone "https://x-access-token:$GH_TOKEN@github.com/$TAP_REPO.git" "$tmp/tap"
          cd "$tmp/tap"
          formula=Formula/fnd.rb
          # Read the CURRENT values before rewriting them. Nothing to do when the
          # formula already points at this version: the tap's bottle workflow may
          # since have added a VALID bottle block, and the deletion below would
          # then open a PR that strips bottles and forces source builds until
          # that workflow runs again. Comparing after the rewrite would of course
          # always match, and skip every genuine bump.
          existing_url=$(sed -nE 's/^  url "([^"]+)"/\1/p' "$formula" | head -n1)
          existing_sha=$(sed -nE 's/^  sha256 "([^"]+)"/\1/p' "$formula" | head -n1)
          if [ "$existing_url" = "$new_url" ] && [ "$existing_sha" = "$new_sha" ]; then
            echo "Homebrew formula already at $VERSION — leaving its bottle block alone"
            exit 0
          fi
          sed -i.bak "s|^  url \".*\"|  url \"$new_url\"|" "$formula"
          sed -i.bak "s|^  sha256 \".*\"|  sha256 \"$new_sha\"|" "$formula"
          # Drop the PREVIOUS version's `bottle do` block. Homebrew derives the
          # bottle filename from the formula version, so a bumped url + a stale
          # root_url makes every `brew upgrade fnd` 404 until the tap's bottle
          # workflow runs. With no block, brew builds from source instead —
          # slower, but never broken. The bottle job re-adds it via
          # `brew bottle --merge --write`. No-op when the block is absent.
          sed -i.bak "/^  bottle do$/,/^  end$/d" "$formula"
          # Collapse the blank-line pair the deletion leaves behind.
          cat -s "$formula" > "$formula.tmp" && mv "$formula.tmp" "$formula"
          rm -f "$formula.bak"
          branch="bump/fnd-$VERSION"
          git checkout -b "$branch"
          git add "$formula"
          if git diff --cached --quiet; then
            # Re-run for a version whose formula is already current: `git commit`
            # would exit 1 on an empty commit and fail the job before the PR.
            echo "Homebrew formula already at $VERSION — nothing to bump"
            exit 0
          fi
          git -c user.email="actions@github.com" -c user.name="fnd-release-bot" \
            commit -m "fnd $VERSION"
          git push -u origin "$branch"
          pr=$(gh pr create \
            --title "fnd $VERSION" \
            --body "Automated bump from ben-dev-au/fnd@${GITHUB_REF##*/}. sha256 \`$new_sha\`.")
          # Merge it here rather than leaving it for a human. The diff is
          # machine-generated from PyPI's own metadata and the tap runs no PR
          # checks, so the manual gate bought nothing — and forgetting it is
          # what left 0.0.5's formula serving a 404 for twelve hours. Merging
          # is also what triggers the tap's bottle build.
          gh pr merge "$pr" --squash --delete-branch

  smoke-pypi:
    name: smoke-test the published wheel
    # Installs from PyPI exactly the way a user does, in a clean runner, and
    # asserts the CLI reports the version we just shipped. The Homebrew half
    # is smoke-tested in the tap's bottle workflow, which is the only place
    # that knows when bottles are actually ready.
    needs: [build, publish-pypi]
    runs-on: macos-14
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - run: uv python install 3.13
      - name: Install from PyPI and run it
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # PyPI's index can lag the upload, same as the tap bump above.
          out=""
          installed=0
          for i in 1 2 3 4 5 6; do
            if out=$(uvx --refresh --from "fndr==$VERSION" fnd version 2>&1); then
              installed=1
              break
            fi
            echo "fndr $VERSION not installable yet (attempt $i); retrying…" >&2
            sleep 10
          done
          printf '%s\n' "$out"
          # The loop's own exit status, not just its output: on six failures
          # `out` holds the error text, which quotes $VERSION and would satisfy
          # a bare grep.
          [ "$installed" -eq 1 ] \
            || { echo "::error::fndr $VERSION never became installable"; exit 1; }
          # Whole line, not substring — 0.0.50 contains 0.0.5.
          printf '%s\n' "$out" | grep -qFx "$VERSION" \
            || { echo "::error::\`fnd version\` did not report exactly $VERSION"; exit 1; }
          echo "PyPI install OK: fndr $VERSION"
