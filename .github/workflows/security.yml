name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 09:00 UTC — catches CVEs published since the last
    # human-driven push.
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (lockfile)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Sync deps (frozen lockfile)
        run: uv sync --frozen --all-extras --group dev
      - name: Install pip-audit
        run: uv tool install pip-audit
      - name: Export resolved requirements
        # `uv export` includes the local `fnd` package itself; pip-audit
        # then tries to look it up on PyPI and fails because we haven't
        # published yet. Drop the self-reference before auditing —
        # remove this filter once Phase 0 of the publish runbook lands
        # `fnd` on PyPI.
        run: |
          uv export --format requirements-txt --no-hashes -o requirements.raw.txt
          grep -v '^fnd==\|^fnd @' requirements.raw.txt > requirements.frozen.txt
      - name: Audit
        run: uv tool run pip-audit -r requirements.frozen.txt --strict

  ruff-security:
    name: ruff (bandit ruleset)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.13
      - run: uv sync --frozen --group dev
      - name: Ruff (project config includes select=S)
        run: uv run ruff check .

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action posts a PR-summary comment on findings; without
      # `pull-requests: write` the action fails with
      # `Resource not accessible by integration`.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
