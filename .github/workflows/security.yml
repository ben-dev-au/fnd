name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 09:00 UTC, catches CVEs published since the last
    # human-driven push.
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (lockfile)
    # ubuntu, not macos: this reads the exported lockfile and is
    # platform-independent. macOS concurrency is capped at 5 on the free
    # plan and the test matrix needs every slot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Sync deps (frozen lockfile)
        run: uv sync --frozen --all-extras --group dev
      - name: Install pip-audit
        run: uv tool install pip-audit
      - name: Export resolved requirements
        # `--no-emit-project` drops the local `fnd` package (which uv
        # emits as `-e .`); pip-audit can't look up an unpublished
        # editable install and would fail the whole audit. Once Phase
        # 0 of the publish runbook lands `fnd` on PyPI, the flag stays:
        # we don't need to audit ourselves, only our deps.
        run: |
          uv export --frozen \
            --format requirements-txt \
            --no-hashes \
            --no-emit-project \
            -o requirements.frozen.txt
      - name: Check out the base branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Audit the base branch
        # Its findings are what main already carries; the PR audit skips them.
        if: github.event_name == 'pull_request'
        run: |
          uv export --frozen --project base \
            --format requirements-txt \
            --no-hashes \
            --no-emit-project \
            -o base.frozen.txt
          uv tool run pip-audit -r base.frozen.txt --strict --format json -o base-audit.json || true
      - name: Audit
        if: github.event_name != 'pull_request'
        run: uv tool run pip-audit -r requirements.frozen.txt --strict
      - name: Audit what the PR introduces
        if: github.event_name == 'pull_request'
        run: |
          uv tool run pip-audit -r requirements.frozen.txt --strict --format json -o pr-audit.json || true
          python3 .github/scripts/new_vulns.py base-audit.json pr-audit.json

  ruff-security:
    name: ruff (bandit ruleset)
    # ubuntu, not macos: a static linter, same concurrency reasoning as above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv python install 3.13
      - run: uv sync --frozen --group dev
      - name: Ruff (project config includes select=S)
        run: uv run ruff check .

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action posts a PR-summary comment on findings; without
      # `pull-requests: write` the action fails with
      # `Resource not accessible by integration`.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
