# `pre-commit install` (no -t flag) installs both hook types below, so
# pyright/pytest-fast (pre-push) actually run rather than sitting silent.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=2000"]

  - repo: local
    # The ruff uv.lock resolves, so the hook and CI cannot run different versions.
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

  - repo: local
    # Each pre-push check skips a tree `make batch-close` already passed
    # (scripts/proven_trees.py), so a push does not repeat the gate.
    hooks:
      - id: pyright
        name: pyright (strict)
        # Pre-push: kept with pytest-fast below so `git commit` stays
        # instant for WIP checkpoints; standalone cost is ~10s.
        stages: [pre-push]
        entry: uv run python scripts/proven_trees.py check -- pyright
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-fast
        name: "pytest (testmon: only tests whose code paths changed)"
        # Pre-push, not pre-commit: keeps `git commit` free for WIP
        # checkpoints. Forceselect, not plain --testmon: `-m` silently
        # deactivates the latter's selection and runs the whole suite.
        stages: [pre-push]
        entry: uv run python scripts/proven_trees.py check -- python scripts/run_tests.py -q -m "not slow" --testmon-forceselect
        language: system
        types: [python]
        pass_filenames: false

      - id: harness-indexing
        name: "harness: indexer status lines (synthetic, fast)"
        # Pre-push only - runs the synthetic indexer harness when
        # touching code that controls how PDFs reach the index.
        # Catches cascading worker death and counter regressions
        # without paying the cost on every commit. Real-corpus
        # validation lives behind FND_AUDIT_REAL_CORPUS=1 and is
        # opt-in via `pre-commit run --hook-stage manual`.
        stages: [pre-push]
        entry: uv run python scripts/proven_trees.py check -- python dev/tools/workflow_audit_tmux.py indexer_status_lines indexer_status_lines_md_only
        language: system
        files: ^(fnd/extract/|fnd/index|fnd/walk\.py|fnd/tui/indexer_modal\.py|dev/tools/workflow_audit_tmux\.py)
        pass_filenames: false
