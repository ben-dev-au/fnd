[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fnd"
version = "0.0.1"
description = "Fast, free, keyboard-driven document search for macOS"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Ben Davidson" }]
# Pins use the compatible-release operator (~=) so `uv sync` cannot
# silently absorb a surprise major from a security-sensitive parser
# (pymupdf and the OOXML parsers especially). uv.lock pins exact
# versions; the operators here gate `uv lock --upgrade`. Bumps go
# through quarterly review documented in SECURITY.md.
dependencies = [
    "tantivy~=0.26",
    "pymupdf~=1.27",
    "python-pptx~=1.0",
    "python-docx~=1.2",
    "markdown-it-py~=4.0",
    "watchdog~=6.0",
    "textual~=8.0",
    "rich~=15.0",
    "typer~=0.25",
    "pydantic~=2.13",
    "pydantic-settings~=2.14",
    "platformdirs~=4.9",
    "snowballstemmer~=3.0",
    "tomlkit~=0.14",
]

[project.optional-dependencies]
ocr = ["ocrmypdf~=17.0"]
# Structured PDF rendering — opt-in via `fnd extras install pdf-structure`.
# docling-slim is installed separately into its own uv tool venv (transitive
# version conflicts with fnd's deps make it unsafe in this venv).
pdf-structure = ["pymupdf4llm~=1.27"]

[tool.pytest.ini_options]
# `slow` flags long-running tests (perf benches, fuzz harness). The
# default fast suite excludes them with `-m "not slow"`; CI's nightly
# job runs the full set.
markers = [
    "slow: long-running tests excluded from the fast suite",
]

[project.scripts]
fnd = "fnd.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8",
    "pytest-textual-snapshot>=1.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.110",
    "pre-commit>=3.8",
    # Used by tools/pdf_bakeoff to normalise ML extractor output before
    # comparison. Not loaded by fnd itself.
    "mdformat>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["fnd"]
