[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fnd"
version = "0.0.1"
description = "Fast, free, keyboard-driven document search for macOS"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Ben Davidson" }]
# Pins use the compatible-release operator (~=) so `uv sync` cannot
# silently absorb a surprise major from a security-sensitive parser
# (pymupdf and the OOXML parsers especially). uv.lock pins exact
# versions; the operators here gate `uv lock --upgrade`. Bumps go
# through quarterly review documented in SECURITY.md.
dependencies = [
    "tantivy~=0.26",
    "pymupdf~=1.27",
    "python-pptx~=1.0",
    "python-docx~=1.2",
    "markdown-it-py~=4.0",
    "watchdog~=6.0",
    "textual~=8.0",
    "rich~=15.0",
    "typer~=0.25",
    "pydantic~=2.13",
    "pydantic-settings~=2.14",
    "platformdirs~=4.9",
    "snowballstemmer~=3.0",
    "tomlkit~=0.14",
    "tomli-w~=1.2",
]

[project.optional-dependencies]
ocr = ["ocrmypdf~=17.0"]

[tool.pytest.ini_options]
# `slow` flags long-running tests (perf benches, fuzz harness). The
# default fast suite excludes them with `-m "not slow"`; CI's nightly
# job runs the full set.
markers = [
    "slow: long-running tests excluded from the fast suite",
]
# fnd/tui/lazy_trailing.py schedules work via `app.call_from_thread` on
# a worker thread. In production this blocks on the cross-thread future
# and returns the callback's value cleanly; in `app.run_test()` the
# event loop teardown races the worker so the internal `run_callback`
# coroutine is occasionally orphaned. Behaviour is correct — the
# warning is purely a test-env artifact.
filterwarnings = [
    "ignore:coroutine 'App.call_from_thread.<locals>.run_callback' was never awaited:RuntimeWarning",
]

[project.scripts]
fnd = "fnd.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8",
    "pytest-textual-snapshot>=1.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.110",
    "pre-commit>=3.8",
    # Used by tools/pdf_bakeoff to normalise ML extractor output before
    # comparison. Not loaded by fnd itself.
    "mdformat>=0.7",
    "pyte>=0.8.2",
]
# Structured PDF rendering — opt-in. Lives in a PEP 735 dependency
# group rather than [project.optional-dependencies] so the user can
# opt in via [tool.uv] default-groups below, and a subsequent
# ``uv sync`` (no flags) won't wipe the install. ``fnd extras
# install pdf-structure`` flips the toggle in default-groups.
#
# pymupdf4llm[layout] pulls pymupdf-layout (Artifex, Polyform
# Noncommercial 1.0 — acceptable because fnd is open-source and
# non-commercial). docling-slim is installed separately into its own
# uv tool venv (transitive version conflicts make it unsafe to
# co-install in fnd's venv).
pdf-structure = ["pymupdf4llm[layout]~=1.27"]

[tool.uv]
# Groups installed by ``uv sync`` when no --group flag is passed.
# ``fnd extras install/uninstall pdf-structure`` edits this list so
# the install persists across subsequent ``uv sync`` calls. ``dev``
# stays the default for the development environment.
default-groups = ["dev", "pdf-structure"]

[tool.hatch.build.targets.wheel]
packages = ["fnd"]
