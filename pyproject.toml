[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acorn"
version = "0.0.1"
description = "Fast, free, keyboard-driven document search for macOS"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Ben Davidson" }]
dependencies = [
    "tantivy>=0.25",
    "pymupdf>=1.27",
    "pymupdf4llm>=0.0.17",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "markdown-it-py>=3.0",
    "watchdog>=4.0",
    "textual>=0.85",
    "rich>=13",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "platformdirs>=4.2",
    "loguru>=0.7",
    "snowballstemmer>=3.0.1",
    "tomlkit>=0.13",
]

[project.optional-dependencies]
ocr = ["ocrmypdf>=16"]

[project.scripts]
acorn = "acorn.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8",
    "pytest-textual-snapshot>=1.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.110",
    "pre-commit>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["acorn"]
