[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# PyPI distribution name. `fnd` was taken, so the package is `fndr`;
# the import package and the primary CLI command stay `fnd` (see
# [tool.hatch.build.targets.wheel] and [project.scripts]).
name = "fndr"
version = "1.0.0"
description = "Fast, free, keyboard-driven document search for macOS (Linux and Windows in early beta)"
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Ben Davidson" }]
keywords = ["search", "cli", "tui", "full-text-search", "pdf", "bm25", "tantivy", "cross-platform"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
# Three-component `~=X.Y.Z` so only patch releases float. uv.lock governs
# dev and CI only and never reaches a user install, so these ranges are
# what ships; minor bumps go through deps-latest.yml (see SECURITY.md).
dependencies = [
    "tantivy~=0.26.0",
    "pymupdf~=1.28.2",
    "python-pptx~=1.0.2",
    "python-docx~=1.2.0",
    # EPUB / HTML / ODF extraction: zip container + XHTML/content.xml parsing.
    # Already resolved transitively via python-docx/python-pptx; declared
    # directly here because fnd/extract/{epub,web,odf}.py import it.
    "lxml~=6.1.2",
    "markdown-it-py~=4.2.0",
    "textual~=8.2.8",
    "rich~=15.0.0",
    "typer~=0.25.1",
    "pydantic~=2.13.5",
    "platformdirs~=4.9.6",
    "snowballstemmer~=3.0.1",
    "tomlkit~=0.14.0",
    "tomli-w~=1.2.0",
    "termaid[rich]>=0.6.1,<0.9.0",
]

[project.urls]
Homepage = "https://github.com/ben-dev-au/fnd"
Repository = "https://github.com/ben-dev-au/fnd"
Issues = "https://github.com/ben-dev-au/fnd/issues"
Funding = "https://buymeacoffee.com/ben.dev.au"

[tool.pytest.ini_options]
# Scope discovery to the public suite; the gitignored dev/ repo carries
# its own standalone harnesses that aren't collectable from this root.
testpaths = ["tests"]
# `slow` flags long-running tests (perf benches, fuzz harness). The
# default fast suite excludes them with `-m "not slow"`; CI's nightly
# job runs the full set.
markers = [
    "slow: long-running tests excluded from the fast suite",
]
# fnd/tui/lazy_trailing.py schedules work via `app.call_from_thread` on
# a worker thread. In production this blocks on the cross-thread future
# and returns the callback's value cleanly; in `app.run_test()` the
# event loop teardown races the worker so the internal `run_callback`
# coroutine is occasionally orphaned. Behaviour is correct — the
# warning is purely a test-env artifact.
filterwarnings = [
    "ignore:coroutine 'App.call_from_thread.<locals>.run_callback' was never awaited:RuntimeWarning",
]

[project.scripts]
fnd = "fnd.cli:main"
# Alias matching the PyPI name so `pipx install fndr && fndr` works.
fndr = "fnd.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8",
    "pytest-textual-snapshot>=1.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.110",
    # Type stubs for lxml (used by the epub/web/odf extractors) so pyright
    # strict can check the etree/html element APIs.
    "lxml-stubs>=0.5",
    "pre-commit>=3.8",
    "pyte>=0.8.2",
    # pytest-testmon: pre-commit only re-runs tests whose imported
    # lines changed in the diff. .testmondata is per-developer and
    # gitignored; CI runs the full suite without --testmon as the
    # safety net.
    "pytest-testmon>=2.1",
]
# Structured PDF rendering — opt-in. Lives in a PEP 735 dependency
# group rather than [project.optional-dependencies] so the user can
# opt in via [tool.uv] default-groups below, and a subsequent
# ``uv sync`` (no flags) won't wipe the install. ``fnd extras
# install pdf-structure`` flips the toggle in default-groups.
#
# pymupdf4llm pulls pymupdf-layout (Polyform Noncommercial 1.0); fnd never
# redistributes it, so the restriction binds the installing user, not fnd.
# The `[layout]` extra is obsolete at ~=1.27 (pymupdf-layout is now a base
# requirement; the extra no longer exists and uv warns if requested).
# docling-slim is installed separately into its own uv tool venv
# (transitive version conflicts make it unsafe to co-install in fnd's venv).
pdf-structure = ["pymupdf4llm~=1.28.2"]

[tool.uv]
# Groups installed by ``uv sync`` when no --group flag is passed.
# ``fnd extras install/uninstall pdf-structure`` edits this list so
# the install persists across subsequent ``uv sync`` calls. ``dev``
# stays the default for the development environment.
default-groups = ["dev", "pdf-structure"]

[tool.hatch.build.targets.wheel]
packages = ["fnd"]
