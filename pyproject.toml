[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fnd"
version = "0.0.1"
description = "Fast, free, keyboard-driven document search for macOS"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Ben Davidson" }]
# Pins use the compatible-release operator (~=) so `uv sync` cannot
# silently absorb a surprise major from a security-sensitive parser
# (pymupdf and the OOXML parsers especially). uv.lock pins exact
# versions; the operators here gate `uv lock --upgrade`. Bumps go
# through quarterly review documented in SECURITY.md.
dependencies = [
    "tantivy~=0.26",
    "pymupdf~=1.27",
    "pymupdf4llm~=1.27",
    "python-pptx~=1.0",
    "python-docx~=1.2",
    "markdown-it-py~=4.0",
    "watchdog~=6.0",
    "textual~=8.0",
    "rich~=15.0",
    "typer~=0.25",
    "pydantic~=2.13",
    "pydantic-settings~=2.14",
    "platformdirs~=4.9",
    "loguru~=0.7",
    "snowballstemmer~=3.0",
    "tomlkit~=0.14",
]

[project.optional-dependencies]
ocr = ["ocrmypdf~=17.0"]

[project.scripts]
fnd = "fnd.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8",
    "pytest-textual-snapshot>=1.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.110",
    "pre-commit>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["fnd"]
