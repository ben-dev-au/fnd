target-version = "py313"
line-length = 100

[lint]
select = [
    "E", "F", "W",      # pyflakes + pycodestyle
    "I",                # isort
    "B",                # bugbear
    "C4",               # comprehensions
    "SIM",              # simplify
    "UP",               # pyupgrade
    "RUF",              # ruff-specific
    "N",                # naming
    "PT",               # pytest style
]
ignore = [
    "E501",             # line length is enforced by formatter
    # The TUI uses non-ASCII glyphs as deliberate UX (breadcrumb `›`,
    # match markers ✓/✗, rule lines `─`, separator dots `·`). These are
    # NOT confusable in their rendered context.
    "RUF001",           # ambiguous unicode in string literal
    "RUF002",           # ambiguous unicode in docstring
    "RUF003",           # ambiguous unicode in comment
]

[lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[lint.per-file-ignores]
"tests/**" = ["B", "SIM"]

[format]
quote-style = "double"
