target-version = "py313"
line-length = 100

[lint]
select = [
    "E", "F", "W",      # pyflakes + pycodestyle
    "I",                # isort
    "B",                # bugbear
    "C4",               # comprehensions
    "SIM",              # simplify
    "UP",               # pyupgrade
    "RUF",              # ruff-specific
    "N",                # naming
    "PT",               # pytest style
    "S",                # bandit-equivalent security rules
]
ignore = [
    "E501",             # line length is enforced by formatter
    # The TUI uses non-ASCII glyphs as deliberate UX (breadcrumb `›`,
    # match markers ✓/✗, rule lines `─`, separator dots `·`). These are
    # NOT confusable in their rendered context.
    "RUF001",           # ambiguous unicode in string literal
    "RUF002",           # ambiguous unicode in docstring
    "RUF003",           # ambiguous unicode in comment
    # S101: `assert` is the canonical pyright-strict type-narrowing
    # pattern used across the codebase (`assert isinstance(x, T)` so
    # the type checker narrows). Convertible to `if not isinstance:
    # raise TypeError`, but the trade is more verbose code for no
    # runtime safety gain — Python's `-O` flag strips asserts, but
    # we don't ship with `-O`.
    "S101",
    # S603: every subprocess call in this codebase uses list-form argv
    # (no shell=True, no string interpolation). S603 fires on every
    # subprocess invocation regardless of input safety — the rule
    # can't tell argv-list calls apart from shell=True calls. Manually
    # audited; see SECURITY.md for the catalogue.
    "S603",
    # S607: macOS-only project; system tools (`open`, `qlmanage`,
    # `osascript`) live at known platform paths. Pinning absolute
    # paths defeats macOS's flexible PATH and gains no security.
    "S607",
]

[lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[lint.per-file-ignores]
"tests/**" = ["B", "SIM", "S"]
# TUI code uses `try/except: pass` and `try/except: continue` as a
# best-effort pattern for UI operations whose failure should not abort
# the surrounding flow (e.g. a stale-widget refresh, a scroll target
# that's been removed). Each call site has a UX-flow rationale; the
# alternative — logging every swallowed exception — would flood the
# log with noise from normal rapid UI churn.
"fnd/tui/**" = ["S110", "S112"]
# scripts/ are dev-only TUI snapshot harnesses (one-off `make
# snap-*` invocations). They write to /tmp deliberately for
# screenshot capture and are never shipped to end users.
"scripts/**" = ["S"]

[format]
quote-style = "double"
